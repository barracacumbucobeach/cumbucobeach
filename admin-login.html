<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar — Painel Cumbuco Beach</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0D3A50">
<link rel="icon" href="assets/logo/favicon.png">
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>
<div class="login">
  <div class="login__foto" aria-hidden="true">
    <img src="assets/images/ambientes/mesas-praia-sol-poente.jpg" alt="">
    <div class="login__frase"><h2>Bom dia de praia para a equipe.</h2></div>
  </div>
  <div class="login__form">
    <form class="login__caixa" id="f" novalidate>
      <img src="assets/logo/logo.png" alt="Cumbuco Beach">
      <h1>Painel de reservas</h1>
      <p id="intro">Entre com o seu e-mail e senha da equipe.</p>
      <label class="fld" id="campo-email"><span>E-mail</span><input class="inp" type="email" id="email" autocomplete="username" inputmode="email"></label>
      <label class="fld" style="margin-top:12px"><span>Senha</span><input class="inp" type="password" id="senha" autocomplete="current-password" required></label>
      <button class="bt bt--pri" type="submit" id="entrar">Entrar no painel</button>
      <div class="login__erro" id="erro" role="alert"></div>
      <a class="login__voltar" href="index.html">Voltar ao site</a>
    </form>
  </div>
</div>
<script src="js/config.js"></script>
<script src="js/storage.js"></script>
<script src="js/nuvem.js"></script>
<script>
(function () {
  if (CB.logado()) { location.replace('admin.html'); return; }
  var N = window.CBNuvem, f = document.getElementById('f'), em = document.getElementById('email'), s = document.getElementById('senha'), e = document.getElementById('erro'), bt = document.getElementById('entrar');
  if (!N.ativo) { document.getElementById('campo-email').hidden = true; document.getElementById('intro').textContent = 'Digite a senha da equipe para ver e organizar as reservas.'; }
  (N.ativo ? em : s).focus();
  function ir() { location.replace('admin.html' + (sessionStorage.getItem('cumbuco_volta') || '')); }
  function erro(msg) { e.textContent = msg; f.classList.remove('treme'); void f.offsetWidth; f.classList.add('treme'); }
  f.addEventListener('submit', function (ev) {
    ev.preventDefault(); e.textContent = '';
    if (!N.ativo) { if (CB.entrar(s.value)) ir(); else { erro('Senha incorreta. Confira e tente de novo.'); s.select(); } return; }
    if (!em.value.trim()) {
      /* sem e-mail: senha do modo WhatsApp (só este aparelho) */
      if (CB.entrar(s.value)) ir(); else erro('Informe o seu e-mail da equipe.');
      return;
    }
    bt.disabled = true; bt.textContent = 'Entrando…';
    N.entrar(em.value, s.value).then(function (r) {
      bt.disabled = false; bt.textContent = 'Entrar no painel';
      if (r.ok) { CB.marcarSessao(); ir(); return; }
      if (r.credenciais) { erro('E-mail ou senha incorretos.'); s.select(); return; }
      /* banco em pausa ou fora do ar */
      if (CB.entrar(s.value)) { ir(); return; }
      erro('O banco está em pausa agora. Para entrar no modo WhatsApp, deixe o e-mail em branco e use a senha do modo WhatsApp.');
    });
  });
})();
</script>
</body>
</html>
