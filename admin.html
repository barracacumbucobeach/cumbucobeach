<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel — Cumbuco Beach</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0D3A50">
<link rel="icon" href="assets/logo/favicon.png">
<link rel="stylesheet" href="css/fonts.css?v=20261026d">
<link rel="stylesheet" href="css/admin.css?v=20261026d">
<script src="js/config.js?v=20261026d"></script>
<script src="js/storage.js?v=20261026d"></script>
<script src="js/nuvem.js?v=20261026d"></script>
<script>
  if (!CB.logado()) { try { sessionStorage.setItem('cumbuco_volta', location.hash); } catch (e) {} location.replace('admin-login.html'); }
</script>
</head>
<body>
<div class="barra-mobile">
  <button type="button" id="abrir-menu" aria-label="Abrir menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  <img src="assets/logo/logo.png" alt="Cumbuco Beach">
  <button type="button" class="nova" data-acao="nova" aria-label="Nova reserva"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
</div>
<div class="veu" id="veu"></div>

<div class="app">
  <aside class="lado" aria-label="Menu do painel">
    <a class="lado__logo" href="#painel"><img src="assets/logo/logo.png" alt=""><span>Cumbuco Beach<small>Painel de reservas</small></span></a>
    <nav class="menu" id="menu"></nav>
    <div class="lado__base">
      <div class="chip-banco" id="chip-banco" role="status"></div>
      <a href="index.html" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>Ver o site</a>
      <button type="button" id="sair"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4h4a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-4M10 17l5-5-5-5M15 12H4"/></svg>Sair</button>
    </div>
  </aside>
  <main class="conteudo" id="conteudo" tabindex="-1"></main>
</div>

<div class="gav" id="gav" aria-hidden="true">
  <div class="gav__veu" data-fechar></div>
  <section class="gav__painel" role="dialog" aria-modal="true" aria-labelledby="gav-titulo"></section>
</div>
<div class="modal" id="modal" aria-hidden="true">
  <div class="modal__veu" data-fechar></div>
  <section class="modal__caixa" role="dialog" aria-modal="true" aria-labelledby="modal-titulo"></section>
</div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>

<script src="js/whatsapp.js?v=20261026d"></script>
<script src="js/admin.js?v=20261026d"></script>
</body>
</html>
