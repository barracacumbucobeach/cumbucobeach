<style>
  html,body{margin:0;padding:0;background:#FDF8EC;color:#12303F;font-family:'Instrument Sans',Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  *{box-sizing:border-box}
  a{color:#1B6A8A;text-decoration:none}
  a:hover{color:#E96A2B}
  :focus-visible{outline:3px solid #E96A2B;outline-offset:2px}
  @media (max-width:900px){.cb-desk{display:none !important}.cb-burger{display:inline-flex !important}}
  .cb-logo{position:relative;display:inline-flex}
  .cb-logo svg{display:block;height:56px;width:auto;overflow:visible}
  .cb-logo g,.cb-logo rect.wipe{transform-origin:0 0}
  @keyframes cbl-fade{from{opacity:0}to{opacity:1}}
  @keyframes cbl-sunIn{0%{transform:translateY(70px) scale(.55);opacity:0}60%{opacity:1}100%{transform:none;opacity:1}}
  @keyframes cbl-rayIn{0%{transform:scale(.35);opacity:0}100%{transform:scale(1);opacity:1}}
  @keyframes cbl-wipe{from{width:0}to{width:880px}}
  @keyframes cbl-lIn{0%{transform:translateY(46px);opacity:0}100%{transform:none;opacity:1}}
  @keyframes cbl-spin{to{transform:rotate(360deg)}}
  @keyframes cbl-breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
  @keyframes cbl-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(5px)}}
  .cb-logo .fade{animation:cbl-fade .5s ease both}
  .cb-logo .rayIn{animation:cbl-rayIn .9s cubic-bezier(.2,.8,.3,1) .12s both}
  .cb-logo .spin{animation:cbl-spin 110s linear 1.2s infinite}
  .cb-logo .sunIn{animation:cbl-sunIn 1s cubic-bezier(.2,.9,.3,1) both}
  .cb-logo .breathe{animation:cbl-breathe 6s ease-in-out 1.2s infinite}
  .cb-logo .wipe{animation:cbl-wipe .9s cubic-bezier(.3,.7,.3,1) .45s both}
  .cb-logo .bob{animation:cbl-bob 5s ease-in-out 1.4s infinite}
  .cb-logo .lIn{animation:cbl-lIn .6s cubic-bezier(.2,.9,.3,1) both}
  .cb-logo .l0{animation-delay:.62s}.cb-logo .l1{animation-delay:.68s}.cb-logo .l2{animation-delay:.74s}
  .cb-logo .l3{animation-delay:.80s}.cb-logo .l4{animation-delay:.86s}.cb-logo .l5{animation-delay:.92s}
  .cb-logo .l6{animation-delay:.98s}.cb-logo .l7{animation-delay:1.06s}.cb-logo .l8{animation-delay:1.12s}
  .cb-logo .l9{animation-delay:1.18s}.cb-logo .l10{animation-delay:1.24s}.cb-logo .l11{animation-delay:1.30s}
  @media (prefers-reduced-motion:reduce){.cb-logo *{animation:none !important}.cb-logo .wipe{width:880px}}
</style>
</helmet>
