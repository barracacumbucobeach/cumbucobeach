<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reserva enviada — Barraca Cumbuco Beach</title>
<meta name="description" content="Sua solicitação de reserva foi registrada.">
<meta name="theme-color" content="#0D3A50">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Barraca Cumbuco Beach">
<meta property="og:title" content="Reserva enviada — Barraca Cumbuco Beach">
<meta property="og:description" content="Sua solicitação de reserva foi registrada.">
<meta property="og:url" content="https://cumbucobeach.com.br/sucesso.html">
<meta property="og:image" content="https://cumbucobeach.com.br/assets/logo/link-preview.png">
<link rel="icon" href="assets/logo/favicon.png">
<link rel="preload" href="assets/fonts/bricolage-grotesque-latin-standard-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/site.css">
<script>document.documentElement.className += ' js';</script>
</head>
<body class="pag-reserva">
<header id="topo"></header>

<main class="wrap">
  <section class="sucesso" id="sucesso">
    <div class="sucesso__sol" aria-hidden="true">
      <svg viewBox="0 0 140 140">
        <g fill="#F7A823" id="raios"></g>
        <circle cx="70" cy="70" r="40" fill="#EF5A24" class="raio-sai"/>
        <path d="M52 71l12 12 25-26" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" pathLength="1" class="desenha" style="animation-delay:.5s"/>
      </svg>
    </div>
    <h1 id="s-titulo">Quase lá!</h1>
    <p class="lead" id="s-texto"></p>
    <div class="sucesso__cod" id="s-cod" hidden><small>Código da reserva</small><b id="s-codigo"></b></div>
    <div class="sucesso__acoes" id="s-acoes"></div>
    <div class="revisao" id="s-resumo" style="margin-top:36px" hidden></div>
  </section>
</main>
<footer id="rodape"></footer>
<script src="js/config.js"></script>
<script src="js/storage.js"></script>
<script src="js/nuvem.js"></script>
<script src="js/whatsapp.js"></script>
<script src="js/layout.js"></script>
<script>
(function () {
  var CB = window.CB, W = window.CBWhats, ICO = window.ICO;
  var esc = function (s) { var d = document.createElement('div'); d.textContent = s == null ? '' : s; return d.innerHTML; };
  var ps = new URLSearchParams(location.search), cod = ps.get('c'), abriu = ps.get('w') === '1';
  var raios = ''; for (var i = 0; i < 12; i++) raios += '<g transform="rotate(' + (i * 30) + ' 70 70)"><rect x="68" y="0" width="4" height="18" rx="2" class="raio-sai" style="animation-delay:' + (0.15 + i * 0.03) + 's"/></g>';
  document.getElementById('raios').innerHTML = raios;
  var r = cod ? CB.getReservaPorCodigo(cod) : null;
  var t = document.getElementById('s-texto'), ac = document.getElementById('s-acoes');
  if (!r) {
    document.getElementById('s-titulo').textContent = 'Reserva não encontrada';
    t.textContent = 'Não encontramos essa reserva neste aparelho. Se você já enviou a mensagem, a equipe responde pelo WhatsApp.';
    ac.innerHTML = '<a class="btn" href="reservar.html">Fazer uma reserva</a><a class="btn btn--zap" data-z target="_blank" rel="noopener">' + ICO.zap + 'Falar no WhatsApp</a>';
    ac.querySelector('[data-z]').href = W.link('Olá! Gostaria de saber sobre a minha reserva.');
    return;
  }
  var link = W.linkReserva(r);
  document.getElementById('s-cod').hidden = false;
  document.getElementById('s-codigo').textContent = r.codigo;
  if (abriu) {
    document.getElementById('s-titulo').textContent = 'Agora é só enviar.';
    t.textContent = 'Abrimos o WhatsApp com a sua reserva pronta. Toque em enviar por lá — a equipe confirma em seguida.';
    ac.innerHTML = '<a class="btn btn--zap" target="_blank" rel="noopener" href="' + esc(link) + '">' + ICO.zap + 'Abrir o WhatsApp de novo</a><a class="btn btn--claro" href="index.html">Voltar ao início</a>';
  } else {
    document.getElementById('s-titulo').textContent = 'Falta um toque.';
    t.textContent = 'Sua reserva foi registrada. Toque no botão abaixo para enviar a mensagem pronta para o WhatsApp da barraca.';
    ac.innerHTML = '<a class="btn btn--zap" rel="noopener" href="' + esc(link) + '">' + ICO.zap + 'Enviar reserva pelo WhatsApp</a>';
  }
  var a = CB.getAmbiente(r.ambienteId) || {};
  var box = document.getElementById('s-resumo'); box.hidden = false;
  box.innerHTML = '<div class="revisao__foto">' + (a.imagem ? '<img src="' + esc(a.imagem) + '" alt="">' : '') + '<span>' + esc(CB.nomeAmbiente(r.ambienteId, r)) + '</span></div><dl>' +
    [['Data', CB.dataExtenso(r.data)], ['Horário de chegada', r.hora], ['Pessoas', r.pessoas], ['Nome', r.nome], ['WhatsApp', r.telefone], ['E-mail', r.email]]
      .map(function (x) { return '<div><dt>' + x[0] + '</dt><dd>' + esc(x[1]) + '</dd></div>'; }).join('') + '</dl>';
})();
</script>
</body>
</html>
