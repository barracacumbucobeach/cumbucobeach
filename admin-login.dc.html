<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="referrer" content="strict-origin-when-cross-origin"/>
<title>Entrar no painel — Barraca Cumbuco Beach</title>
<link rel="icon" href="./assets/logo/favicon.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
  html,body{margin:0;padding:0;background:#16506A;color:#12303F;font-family:'Instrument Sans',Helvetica,Arial,sans-serif}
  *{box-sizing:border-box}
  a{color:#1B6A8A;text-decoration:none}
  a:hover{color:#E96A2B}
  :focus-visible{outline:3px solid #E96A2B;outline-offset:2px}
</style>
<script src="./js/supabase-config.js"></script>
<script src="./js/storage.js"></script>
<script src="./js/cloud.js"></script>
</helmet>
<main style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(#16506A,#1B6A8A)">
  <div style="width:100%;max-width:420px;background:#FDF8EC;border-radius:22px;padding:clamp(26px,5vw,40px);box-shadow:0 26px 60px rgba(0,0,0,.28)">
    <img src="./assets/logo/logo.png" alt="Barraca Cumbuco Beach" style="height:78px;width:auto;display:block;margin:0 auto"/>
    <h1 style="font-family:'Bricolage Grotesque',Georgia,serif;font-size:26px;margin:24px 0 6px;color:#12303F">Painel administrativo</h1>
    <p style="margin:0 0 26px;font-size:14px;color:#5A6B75">Acesso restrito à equipe da barraca.</p>
    <div style="display:flex;flex-direction:column;gap:16px">
      <label style="display:flex;flex-direction:column;gap:8px;font-size:13px;font-weight:600;color:#12303F">E-mail ou usuário
        <input type="text" ref="{{ refUser }}" onInput="{{ setUser }}" onKeyDown="{{ onKey }}" autoComplete="username" style="font:inherit;font-weight:400;padding:14px;border:1px solid rgba(22,80,106,.25);border-radius:12px;background:#fff;color:#12303F;caret-color:#12303F;-webkit-text-fill-color:#12303F"/>
      </label>
      <label style="display:flex;flex-direction:column;gap:8px;font-size:13px;font-weight:600;color:#12303F">Senha
        <input type="password" ref="{{ refPass }}" onInput="{{ setPass }}" onKeyDown="{{ onKey }}" autoComplete="current-password" style="font:inherit;font-weight:400;padding:14px;border:1px solid rgba(22,80,106,.25);border-radius:12px;background:#fff;color:#12303F;caret-color:#12303F;-webkit-text-fill-color:#12303F"/>
      </label>
      <sc-if value="{{ erro }}" hint-placeholder-val="{{ false }}">
        <p role="alert" style="margin:0;background:#FBEFEE;color:#9B3B34;border-radius:10px;padding:12px;font-size:13px;font-weight:600">{{ erro }}</p>
      </sc-if>
      <button type="button" onClick="{{ entrar }}" style="cursor:pointer;border:0;background:#16506A;color:#F7EEDA;padding:16px;border-radius:12px;font-size:14px;font-weight:700;letter-spacing:.05em" style-hover="background:#1B6A8A">ENTRAR</button>
    </div>
    <p style="margin:24px 0 0;font-size:12px;line-height:1.7;color:#78888F;background:#F7EEDA;border-radius:10px;padding:12px">Entre com o e-mail e a senha cadastrados no banco de dados da barraca. Nenhuma senha fica guardada neste site.</p>
    <p style="margin:18px 0 0;font-size:13px"><a href="index.html">← Voltar ao site</a></p>
  </div>
</main>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { erro: '' };
  refUser = React.createRef();
  refPass = React.createRef();
  entrar = async () => {
    const CB = window.CB;
    if (!CB) return;
    const user = (this.refUser.current ? this.refUser.current.value : '').trim();
    const pass = this.refPass.current ? this.refPass.current.value : '';
    // banco compartilhado: autenticação real por e-mail e senha
    if (CB.loginAsync) {
      this.setState({ erro: '' });
      if (await CB.loginAsync(user, pass)) { location.href = 'admin.dc.html'; return; }
    }
    if (CB.login(user, pass)) location.href = 'admin.dc.html';
    else this.setState({ erro: CB.ultimoErroLogin || 'Usuário ou senha incorretos.' });
  };
  renderVals() {
    return {
      erro: this.state.erro,
      refUser: this.refUser, refPass: this.refPass,
      setUser: () => { if (this.state.erro) this.setState({ erro: '' }); },
      setPass: () => { if (this.state.erro) this.setState({ erro: '' }); },
      onKey: e => { if (e.key === 'Enter') this.entrar(); },
      entrar: this.entrar
    };
  }
}

</script>
</body>
</html>
