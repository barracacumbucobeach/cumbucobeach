<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ambientes — Barraca Cumbuco Beach</title>
<meta name="description" content="Conheça os dez espaços da Barraca Cumbuco Beach: mesas pé na areia, salões cobertos e tendas.">
<meta name="theme-color" content="#0D3A50">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Barraca Cumbuco Beach">
<meta property="og:title" content="Ambientes — Barraca Cumbuco Beach">
<meta property="og:description" content="Conheça os dez espaços da Barraca Cumbuco Beach: mesas pé na areia, salões cobertos e tendas.">
<meta property="og:url" content="https://cumbucobeach.com.br/ambientes.html">
<meta property="og:image" content="https://cumbucobeach.com.br/assets/logo/link-preview.png">
<link rel="icon" href="assets/logo/favicon.png">
<link rel="preload" href="assets/fonts/bricolage-grotesque-latin-standard-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/site.css">
<script>document.documentElement.className += ' js';</script>
</head>
<body>
<header id="topo"></header>

<main>
  <section class="wrap cab-pag">
    <h1>Os ambientes</h1>
    <p class="lead">Dez espaços para escolher: mesas na areia de frente para o mar, salões cobertos com sombra o dia todo e tendas para grupos de até seis pessoas.</p>
  </section>
  <div class="wrap" id="lista-amb"></div>
  <section class="wrap" style="margin-top:clamp(56px,8vw,110px)">
    <div class="chamada" data-rev>
      <div class="chamada__sol" data-sol aria-hidden="true"></div>
      <div><h2>Já sabe onde quer ficar?</h2><p>Escolha o espaço, o dia e o horário. A reserva vai pronta para o nosso WhatsApp.</p></div>
      <a class="btn" href="reservar.html">Reservar mesa <i data-ico="seta"></i></a>
    </div>
  </section>
</main>
<footer id="rodape"></footer>
<script src="js/config.js"></script>
<script src="js/storage.js"></script>
<script src="js/nuvem.js"></script>
<script src="js/whatsapp.js"></script>
<script src="js/layout.js"></script>
<script>
function desenharAmbientes() {
  var CB = window.CB, ICO = window.ICO;
  var esc = function (s) { var d = document.createElement('div'); d.textContent = s == null ? '' : s; return d.innerHTML; };
  var ambs = CB.getAmbientes(true);
  document.getElementById('lista-amb').innerHTML = CB.CATEGORIAS.map(function (c) {
    var l = ambs.filter(function (a) { return a.cat === c.id; }); if (!l.length) return '';
    return '<section class="secao" style="padding:clamp(28px,4vw,48px) 0" aria-labelledby="cat-' + c.id + '"><div class="secao__cab" style="margin-bottom:24px" data-rev><h2 id="cat-' + c.id + '">' + esc(c.nome) + '</h2><p class="lead">' + esc(c.resumo) + '</p></div><div class="trilho" style="margin-top:0">' +
      l.map(function (a) {
        return '<a class="amb" data-rev href="reservar.html?local=' + encodeURIComponent(CB.slug(a.nome)) + '"><div class="amb__foto">' + (a.imagem ? '<img src="' + esc(a.imagem) + '" alt="' + esc(a.nome) + '" loading="lazy" width="900" height="1600">' : '') +
          (a.capacidade ? '<span class="amb__cap">' + ICO.gente + 'até ' + a.capacidade + ' pessoas</span>' : '') + '</div><div class="amb__txt"><h3>' + esc(a.nome) + '</h3><p>' + esc(a.descricao) + '</p><span class="amb__ir">Reservar aqui ' + ICO.seta + '</span></div></a>';
      }).join('') + '</div></section>';
  }).join('');
  var io = new IntersectionObserver(function (es) { es.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add('visto'); io.unobserve(e.target); } }); }, { threshold: .1 });
  [].forEach.call(document.querySelectorAll('#lista-amb [data-rev]'), function (el) { io.observe(el); });
}
desenharAmbientes();
if (window.CBNuvem) CBNuvem.publico.then(function (ok) { if (ok) desenharAmbientes(); });
</script>
</body>
</html>
