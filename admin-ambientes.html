<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="referrer" content="strict-origin-when-cross-origin"/>
<title>Ambientes — Painel Barraca Cumbuco Beach</title>
<script src="./js/supabase-config.js"></script>
<script src="./js/storage.js"></script>
<script src="./js/cloud.js"></script>
</helmet>
<div class="cb-shell" style="display:flex;align-items:stretch;min-height:100vh">
  <div class="cb-sidemount" style="width:262px;flex:0 0 262px;background:#16506A;align-self:stretch">
    <dc-import name="AdminSidebar" active="Ambientes" hint-size="100%,100vh"></dc-import>
  </div>
  <main style="flex:1;min-width:0;padding:clamp(20px,3vw,38px)">
    <header style="display:flex;flex-wrap:wrap;gap:14px;align-items:end;justify-content:space-between;margin-bottom:22px">
      <div>
        <div style="font-size:11px;letter-spacing:.16em;color:#1B6A8A;font-weight:600">AMBIENTES</div>
        <h1 style="font-family:'Bricolage Grotesque',Georgia,serif;font-size:clamp(24px,3.6vw,36px);margin:8px 0 0;color:#12303F">Cadastro de ambientes</h1>
        <p style="margin:6px 0 0;font-size:14px;color:#5A6B75;max-width:60ch">Capacidade 0 significa "sem limite definido": o sistema não bloqueia reservas por lotação até que um número seja informado.</p>
      </div>
      <button type="button" onClick="{{ novo }}" style="cursor:pointer;border:0;background:#16506A;color:#F7EEDA;padding:14px 22px;border-radius:10px;font-size:12px;font-weight:700;letter-spacing:.04em" style-hover="background:#1B6A8A">ADICIONAR AMBIENTE</button>
    </header>

    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px">
      <sc-for list="{{ itens }}" as="a" hint-placeholder-count="8">
        <section style="background:#fff;border:1px solid rgba(22,80,106,.12);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:10px">
          <div style="display:flex;justify-content:space-between;align-items:center;gap:10px">
            <span style="font-size:11px;letter-spacing:.1em;color:#78888F;font-weight:700">ORDEM {{ a.ordem }}</span>
            <span style="font-size:10px;font-weight:700;letter-spacing:.06em;padding:5px 9px;border-radius:999px;color:#fff;background:{{ a.corStatus }}">{{ a.labelStatus }}</span>
          </div>
          <label style="display:flex;flex-direction:column;gap:5px;font-size:11px;font-weight:600;letter-spacing:.08em;color:#78888F">NOME
            <input type="text" value="{{ a.nome }}" onChange="{{ a.setNome }}" style="font:inherit;font-size:14px;padding:10px;border:1px solid rgba(22,80,106,.22);border-radius:9px"/>
          </label>
          <label style="display:flex;flex-direction:column;gap:5px;font-size:11px;font-weight:600;letter-spacing:.08em;color:#78888F">DESCRIÇÃO
            <textarea rows="3" value="{{ a.descricao }}" onChange="{{ a.setDescricao }}" style="font:inherit;font-size:14px;padding:10px;border:1px solid rgba(22,80,106,.22);border-radius:9px;resize:vertical"></textarea>
          </label>
          <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px">
            <label style="display:flex;flex-direction:column;gap:5px;font-size:11px;font-weight:600;letter-spacing:.08em;color:#78888F">CAPACIDADE
              <input type="number" min="0" value="{{ a.capacidade }}" onChange="{{ a.setCapacidade }}" style="font:inherit;font-size:14px;padding:10px;border:1px solid rgba(22,80,106,.22);border-radius:9px"/>
            </label>
            <label style="display:flex;flex-direction:column;gap:5px;font-size:11px;font-weight:600;letter-spacing:.08em;color:#78888F">ORDEM
              <input type="number" min="1" value="{{ a.ordem }}" onChange="{{ a.setOrdem }}" style="font:inherit;font-size:14px;padding:10px;border:1px solid rgba(22,80,106,.22);border-radius:9px"/>
            </label>
          </div>
          <label style="display:flex;flex-direction:column;gap:5px;font-size:11px;font-weight:600;letter-spacing:.08em;color:#78888F">IMAGEM (caminho ou URL)
            <input type="text" value="{{ a.imagem }}" onChange="{{ a.setImagem }}" placeholder="assets/images/ambientes/tendas-praia.jpg" style="font:inherit;font-size:14px;padding:10px;border:1px solid rgba(22,80,106,.22);border-radius:9px"/>
          </label>
          <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:4px">
            <button type="button" onClick="{{ a.salvar }}" style="cursor:pointer;border:0;background:#16506A;color:#F7EEDA;padding:11px 16px;border-radius:9px;font-size:11px;font-weight:700;letter-spacing:.04em" style-hover="background:#1B6A8A">SALVAR</button>
            <button type="button" onClick="{{ a.alternar }}" style="cursor:pointer;background:#F7EEDA;border:1px solid rgba(22,80,106,.2);color:#12303F;padding:11px 16px;border-radius:9px;font-size:11px;font-weight:700" style-hover="background:#EFEAE0">{{ a.labelAlternar }}</button>
            <button type="button" onClick="{{ a.excluir }}" style="cursor:pointer;background:#fff;border:1px solid rgba(155,59,52,.35);color:#9B3B34;padding:11px 16px;border-radius:9px;font-size:11px;font-weight:700" style-hover="background:#FBEFEE">EXCLUIR</button>
          </div>
        </section>
      </sc-for>
    </div>
  </main>
</div>
<sc-if value="{{ toast }}" hint-placeholder-val="{{ false }}">
  <div role="status" style="position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#12303F;color:#F7EEDA;padding:15px 22px;border-radius:999px;font-size:14px;font-weight:600;box-shadow:0 14px 34px rgba(0,0,0,.25);z-index:99">{{ toast }}</div>
</sc-if>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { lista: [], draft: {}, toast: '' };
  componentDidMount() {
    const tick = () => {
      if (!window.CB) return setTimeout(tick, 60);
      if (!window.CB.requireAuth()) return;
      this.load();
    };
    tick();
  }
  load() {
    const lista = window.CB.getSpaces();
    const draft = {};
    lista.forEach(a => { draft[a.id] = { nome: a.nome, descricao: a.descricao, capacidade: a.capacidade, ordem: a.ordem, imagem: a.imagem || '' }; });
    this.setState({ lista, draft });
  }
  toast(t) {
    this.setState({ toast: t });
    clearTimeout(this._tt);
    this._tt = setTimeout(() => this.setState({ toast: '' }), 2800);
  }
  set(id, patch) {
    this.setState({ draft: Object.assign({}, this.state.draft, { [id]: Object.assign({}, this.state.draft[id], patch) }) });
  }
  renderVals() {
    const CB = window.CB, s = this.state;
    return {
      toast: s.toast,
      novo: () => {
        CB.saveSpace({ nome: 'Novo ambiente', descricao: 'Descrição do ambiente.', capacidade: 0, imagem: '', ativo: true });
        this.load();
        this.toast('Ambiente criado. Ajuste os dados e salve.');
      },
      itens: s.lista.map(a => {
        const d = s.draft[a.id] || {};
        return {
          nome: d.nome || '', descricao: d.descricao || '', capacidade: d.capacidade === undefined ? 0 : d.capacidade,
          ordem: d.ordem === undefined ? 1 : d.ordem, imagem: d.imagem || '',
          labelStatus: a.ativo ? 'ATIVO' : 'DESATIVADO',
          corStatus: a.ativo ? '#1B6A8A' : '#9B3B34',
          labelAlternar: a.ativo ? 'DESATIVAR' : 'ATIVAR',
          setNome: e => this.set(a.id, { nome: e.target.value }),
          setDescricao: e => this.set(a.id, { descricao: e.target.value }),
          setCapacidade: e => this.set(a.id, { capacidade: parseInt(e.target.value, 10) || 0 }),
          setOrdem: e => this.set(a.id, { ordem: parseInt(e.target.value, 10) || 1 }),
          setImagem: e => this.set(a.id, { imagem: e.target.value }),
          salvar: () => { CB.saveSpace(Object.assign({ id: a.id }, s.draft[a.id])); this.load(); this.toast('Ambiente atualizado.'); },
          alternar: () => { CB.saveSpace({ id: a.id, ativo: !a.ativo }); this.load(); this.toast(a.ativo ? 'Ambiente desativado.' : 'Ambiente ativado.'); },
          excluir: () => {
            if (!confirm('Excluir o ambiente "' + a.nome + '"? As reservas existentes ficarão sem ambiente.')) return;
            CB.deleteSpace(a.id); this.load(); this.toast('Ambiente excluído.');
          }
        };
      })
    };
  }
}

</script>
</body>
</html>
