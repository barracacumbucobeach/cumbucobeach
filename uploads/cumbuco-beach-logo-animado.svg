<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1920 1080" width="1920" height="1080" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Cumbuco Beach — animated logo</title>
  <defs>
    <image id="lg" width="1003" height="776"></image>
    <radialGradient id="bg" cx="50%" cy="28%" r="78%">
      <stop offset="0%" stop-color="#12384A"></stop><stop offset="45%" stop-color="#0A2130"></stop><stop offset="100%" stop-color="#07161E"></stop>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E74523" stop-opacity="0.34"></stop>
      <stop offset="34%" stop-color="#F18818" stop-opacity="0.16"></stop>
      <stop offset="72%" stop-color="#008292" stop-opacity="0"></stop>
    </radialGradient>
    <linearGradient id="sea" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#008292" stop-opacity="0.2"></stop><stop offset="100%" stop-color="#008292" stop-opacity="0"></stop>
    </linearGradient>
    <clipPath id="rayBox"><rect x="0" y="0" width="1003" height="288"></rect></clipPath>
    <mask id="rayMask"><rect x="0" y="0" width="1003" height="776" fill="#fff"></rect><circle cx="492.5" cy="266.6" r="136" fill="#000"></circle></mask>
    <clipPath id="sunBox"><rect x="348" y="92" width="290" height="199"></rect></clipPath>
    <clipPath id="sunDisc"><circle cx="492.5" cy="266.6" r="138"></circle></clipPath>
    <clipPath id="waveBox"><rect x="128" y="280" width="752" height="98"></rect></clipPath>
    <clipPath id="waveWipe"><rect class="wipe" x="120" y="260" width="0" height="140"></rect></clipPath>
    <clipPath id="l0"><rect x="0" y="389" width="116" height="222"></rect></clipPath>
    <clipPath id="l1"><rect x="147" y="389" width="105" height="222"></rect></clipPath>
    <clipPath id="l2"><rect x="287" y="389" width="140" height="222"></rect></clipPath>
    <clipPath id="l3"><rect x="463" y="389" width="103" height="222"></rect></clipPath>
    <clipPath id="l4"><rect x="599" y="389" width="105" height="222"></rect></clipPath>
    <clipPath id="l5"><rect x="736" y="389" width="116" height="222"></rect></clipPath>
    <clipPath id="l6"><rect x="883" y="389" width="119" height="222"></rect></clipPath>
    <clipPath id="l7"><rect x="198" y="617" width="108" height="159"></rect></clipPath>
    <clipPath id="l8"><rect x="335" y="617" width="92" height="159"></rect></clipPath>
    <clipPath id="l9"><rect x="452" y="617" width="107" height="159"></rect></clipPath>
    <clipPath id="l10"><rect x="576" y="617" width="99" height="159"></rect></clipPath>
    <clipPath id="l11"><rect x="702" y="617" width="102" height="159"></rect></clipPath>
    <filter id="liquid" x="-25%" y="-60%" width="150%" height="220%" color-interpolation-filters="sRGB">
      <feTurbulence type="turbulence" baseFrequency="0.004 0.012" numOctaves="1" seed="7" result="n">
        
      </feTurbulence>
      <feOffset in="n" dy="0" result="no"></feOffset>
      <feDisplacementMap in="SourceGraphic" in2="no" scale="4.5" xChannelSelector="R" yChannelSelector="G"></feDisplacementMap>
    </filter>
    <filter id="sunGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="20" flood-color="#E74523" flood-opacity="0.55"></feDropShadow>
    </filter>
    <filter id="rayGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="9" flood-color="#F18818" flood-opacity="0.6"></feDropShadow>
    </filter>
  </defs>
  

  <rect width="1920" height="1080" fill="url(#bg)"></rect>
  <ellipse class="glow" cx="960" cy="368" rx="750" ry="750" fill="url(#glow)"></ellipse>
  <rect class="sea" x="0" y="660" width="1920" height="420" fill="url(#sea)"></rect>

  <g class="fade">
    <g class="cam">
      <g class="drift">
        <g transform="translate(408.35,113.2) scale(1.1)">

          <g transform="translate(492.5,266.6)"><g class="spin"><g class="rayPulse"><g class="rayIn"><g transform="translate(-492.5,-266.6)">
            <g filter="url(#rayGlow)" clip-path="url(#rayBox)" mask="url(#rayMask)"><use xlink:href="#lg"></use></g>
          </g></g></g></g></g>

          <g transform="translate(492.5,266.6)"><g class="sunIn"><g class="breathe"><g transform="translate(-492.5,-266.6)">
            <g filter="url(#sunGlow)" clip-path="url(#sunBox)"><use xlink:href="#lg" clip-path="url(#sunDisc)"></use></g>
          </g></g></g></g>

          <g clip-path="url(#waveWipe)"><g class="waveIn"><g class="bob">
            <g filter="url(#liquid)" clip-path="url(#waveBox)"><use xlink:href="#lg"></use></g>
          </g></g></g>

          <g transform="translate(58,611)"><g class="lIn l0"><g class="ripple r0"><g transform="translate(-58,-611)"><use xlink:href="#lg" clip-path="url(#l0)" class="cream"></use></g></g></g></g>
          <g transform="translate(199.5,611)"><g class="lIn l1"><g class="ripple r1"><g transform="translate(-199.5,-611)"><use xlink:href="#lg" clip-path="url(#l1)" class="cream"></use></g></g></g></g>
          <g transform="translate(357,611)"><g class="lIn l2"><g class="ripple r2"><g transform="translate(-357,-611)"><use xlink:href="#lg" clip-path="url(#l2)" class="cream"></use></g></g></g></g>
          <g transform="translate(514.5,611)"><g class="lIn l3"><g class="ripple r3"><g transform="translate(-514.5,-611)"><use xlink:href="#lg" clip-path="url(#l3)" class="cream"></use></g></g></g></g>
          <g transform="translate(651.5,611)"><g class="lIn l4"><g class="ripple r4"><g transform="translate(-651.5,-611)"><use xlink:href="#lg" clip-path="url(#l4)" class="cream"></use></g></g></g></g>
          <g transform="translate(794,611)"><g class="lIn l5"><g class="ripple r5"><g transform="translate(-794,-611)"><use xlink:href="#lg" clip-path="url(#l5)" class="cream"></use></g></g></g></g>
          <g transform="translate(942.5,611)"><g class="lIn l6"><g class="ripple r6"><g transform="translate(-942.5,-611)"><use xlink:href="#lg" clip-path="url(#l6)" class="cream"></use></g></g></g></g>
          <g transform="translate(252,776)"><g class="lIn l7"><g class="ripple r7"><g transform="translate(-252,-776)"><use xlink:href="#lg" clip-path="url(#l7)"></use></g></g></g></g>
          <g transform="translate(381,776)"><g class="lIn l8"><g class="ripple r8"><g transform="translate(-381,-776)"><use xlink:href="#lg" clip-path="url(#l8)"></use></g></g></g></g>
          <g transform="translate(505.5,776)"><g class="lIn l9"><g class="ripple r9"><g transform="translate(-505.5,-776)"><use xlink:href="#lg" clip-path="url(#l9)"></use></g></g></g></g>
          <g transform="translate(625.5,776)"><g class="lIn l10"><g class="ripple r10"><g transform="translate(-625.5,-776)"><use xlink:href="#lg" clip-path="url(#l10)"></use></g></g></g></g>
          <g transform="translate(753,776)"><g class="lIn l11"><g class="ripple r11"><g transform="translate(-753,-776)"><use xlink:href="#lg" clip-path="url(#l11)"></use></g></g></g></g>
        </g>
      </g>
    </g>
  </g>
</svg>